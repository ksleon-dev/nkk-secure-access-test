[package]
name = "nkk-secure-access"
version = "0.1.0"
description = "NKK Secure Access — Netbird VPN Client (white-label fähig)"
authors = ["KronSolutions GmbH"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nkk_secure_access_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync", "time", "net"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tauri-plugin-updater = "2.10.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
