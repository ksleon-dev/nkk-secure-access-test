[package]
name = "nkk-cli"
version.workspace = true
edition = "2021"
rust-version = "1.77.2"
description = "NKK Secure Access - headless CLI (NetBird), shares nkk-core with the desktop app"
authors = ["KronSolutions GmbH"]

[[bin]]
name = "nkk-secure-access-cli"
path = "src/main.rs"

[dependencies]
nkk-core = { path = "../nkk-core" }
tokio = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
# Linux-Self-Update: dieselbe minisign-Signatur wie der GUI-Updater verifizieren
# (beide Crates liegen bereits im Workspace-Lock via tauri-plugin-updater).
minisign-verify = "0.2"
base64 = "0.21"
