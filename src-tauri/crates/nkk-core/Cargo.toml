[package]
name = "nkk-core"
version.workspace = true
edition = "2021"
rust-version = "1.77.2"
description = "Tauri-free core (NetBird, Branding, Logging) shared by the NKK Secure Access app and CLI"
authors = ["KronSolutions GmbH"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
# Optional: only the GUI needs keyring (and its dbus dep on Linux). The headless
# CLI builds without this feature, so it stays dbus-free on a server.
keyring = { workspace = true, optional = true }

[features]
keyring = ["dep:keyring"]
