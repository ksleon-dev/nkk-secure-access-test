# Zum bestehenden NetBird docker-compose.yml hinzufügen,
# oder separat starten: docker compose up -d

services:
  nkk-api:
    build: .
    container_name: nkk-api
    restart: unless-stopped
    ports:
      - "9876:9876"
    volumes:
      - nkk-data:/data
    environment:
      - PORT=9876
      - DATA_DIR=/data
    labels:
      - "com.kronsolutions.service=nkk-api"

volumes:
  nkk-data:
    driver: local
