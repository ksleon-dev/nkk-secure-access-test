# NKK VPN Management — vpn.secure.nkk-hb.de
# NetBird Dashboard Reverse Proxy
# Manuell nach /etc/nginx/sites-available/ auf nkk-secure kopieren

server {
    listen 80;
    server_name vpn.secure.nkk-hb.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (NetBird Dashboard)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Nach SSL Setup (certbot --nginx -d vpn.secure.nkk-hb.de):
# Certbot fuegt automatisch die SSL Direktiven + Redirect ein
