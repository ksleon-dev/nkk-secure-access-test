name: Build Windows Installer

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same branch — only the
# latest commit is built.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for git describe

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Download bundled NetBird client
        shell: pwsh
        run: pwsh src-tauri/bin/fetch-netbird.ps1

      - name: Run Rust unit tests
        working-directory: src-tauri
        # Tests need to run AFTER netbird-installer.exe is fetched because
        # the Tauri build script verifies bundled resource paths exist.
        run: cargo test --release --quiet --lib
        continue-on-error: true  # don't gate the build on tests during pilot

      - name: Bake setup key into installer (if secret is set)
        shell: pwsh
        env:
          NKK_SETUP_KEY: ${{ secrets.NKK_SETUP_KEY }}
        run: |
          # Write the setup key to a file that the NSIS installer reads at
          # install time. The file is bundled as a Tauri resource so it ends
          # up in $INSTDIR\resources\bin\setup.conf.
          # If the secret is not set, we leave the existing empty placeholder
          # in place so the Tauri resources mapping still resolves.
          $key = if ($env:NKK_SETUP_KEY) { $env:NKK_SETUP_KEY.Trim() } else { "" }
          if ($key) {
            Set-Content -Path src-tauri/bin/setup.conf -Value $key -NoNewline -Encoding ASCII
            Write-Host "Setup key baked into bundle (length: $($key.Length))"
          } else {
            Write-Host "No NKK_SETUP_KEY secret set — leaving setup.conf empty."
          }

      - name: Build Tauri (NSIS with update signing)
        run: npm run tauri build -- --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Locate built installer
        id: find_installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No NSIS installer produced"
            exit 1
          }
          Write-Host "Found: $($exe.FullName)"
          Write-Host "Size:  $([math]::Round($exe.Length / 1MB, 2)) MB"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nkk-secure-access-windows
          path: |
            ${{ steps.find_installer.outputs.path }}
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 30

      - name: Generate updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          $sig = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*.sig" | Select-Object -First 1
          $sigContent = if ($sig) { Get-Content $sig.FullName -Raw } else { "" }
          $downloadUrl = "https://github.com/leonkro-test/nkk-secure-access-test/releases/download/${{ github.ref_name }}/$($exe.Name)"
          $manifest = @{
            version = $version
            notes = "NKK Secure Access $version"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent.Trim()
                url = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 4
          Set-Content -Path "latest.json" -Value $manifest
          Write-Host "Generated latest.json for v$version"

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find_installer.outputs.path }}
            latest.json
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "NKK Secure Access ${{ github.ref_name }}"
          body: |
            ## NKK Secure Access ${{ github.ref_name }}

            **Auto Update:** Bestehende Installationen aktualisieren sich automatisch.

            **Neuinstallation:** `${{ steps.find_installer.outputs.name }}` herunterladen und doppelklicken.

            Support: support@ticket.kronsolutions.de
