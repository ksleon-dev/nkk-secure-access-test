name: Build NKK Secure Access (Windows + macOS)

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same branch — only the
# latest commit is built.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Headless Linux CLI: builds and tests the Tauri-free CLI + core only (no GUI,
  # no WebKit/GTK), and ships the Linux binary as an artifact for servers/RMM.
  build-linux-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test core + build CLI
        working-directory: src-tauri
        run: |
          cargo test -p nkk-core --release --quiet
          cargo build -p nkk-cli --release
      - name: Upload Linux CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: nkk-secure-access-cli-linux
          path: src-tauri/target/release/nkk-secure-access-cli
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: windows

      - name: Install npm dependencies
        run: npm ci

      # Single-source-of-truth guard: package.json, tauri.conf.json and
      # Cargo.toml must agree. On a tag build the tag and a CHANGELOG entry must
      # match too — this prevents shipping a release the updater can't resolve.
      - name: Verify version consistency
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "package.json=$pkg  tauri.conf.json=$conf  Cargo.toml=$cargo"
          if ($pkg -ne $conf -or $pkg -ne $cargo) {
            Write-Error "Version mismatch across manifests."
            exit 1
          }
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($tag -ne $pkg) {
              Write-Error "Tag $tag does not match manifest version $pkg."
              exit 1
            }
            # Anchor to a real "## [x.y.z]" section header — the same shape the
            # notes-extractor needs (else the guard passes but notes fall back to
            # generic placeholder text).
            if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($pkg))\]")) {
              Write-Error "CHANGELOG.md has no '## [$pkg]' section header."
              exit 1
            }
          }
          Write-Host "Version consistency OK ($pkg)"

      - name: Download bundled NetBird client
        shell: pwsh
        run: pwsh src-tauri/bin/fetch-netbird.ps1

      - name: Verify bundled binaries are populated (no 0-byte placeholders)
        shell: pwsh
        run: |
          $checks = @{
            'src-tauri/bin/vc_redist.x64.exe'     = 1000000
            'src-tauri/bin/wintun.dll'            = 100000
            'src-tauri/bin/netbird-installer.exe' = 500000
          }
          foreach ($f in $checks.Keys) {
            if (-not (Test-Path $f)) { Write-Error "Bundle-Datei fehlt: $f"; exit 1 }
            $len = (Get-Item $f).Length
            if ($len -lt $checks[$f]) { Write-Error "Bundle-Datei zu klein/leer: $f ($len B, min $($checks[$f]))"; exit 1 }
            Write-Host "OK: $f ($len B)"
          }

      # The app crate's lib test compiles run(), which invokes
      # tauri::generate_context!() - a proc macro that validates frontendDist
      # (../dist) at compile time and panics if it is missing. Build the frontend
      # first so `cargo test` can compile the app crate (nkk-core tests run either
      # way, but commands.rs unit tests live in the app crate).
      - name: Build frontend (dist needed by generate_context in lib tests)
        run: npm run build

      - name: Run Rust unit tests
        working-directory: src-tauri
        # --workspace so the nkk-core tests (NetBird status/latency parsers, the
        # heart of the status display) actually run, not just the app crate.
        # Blocking now (no continue-on-error): a red test must stop the build.
        run: cargo test --workspace --release --quiet --lib

      - name: Bake setup key into installer (if secret is set)
        shell: pwsh
        env:
          NKK_SETUP_KEY: ${{ secrets.NKK_SETUP_KEY }}
        run: |
          $key = if ($env:NKK_SETUP_KEY) { $env:NKK_SETUP_KEY.Trim() } else { "" }
          if ($key) {
            Set-Content -Path src-tauri/bin/setup.conf -Value $key -NoNewline -Encoding ASCII
            Write-Host "Setup key baked into bundle (length: $($key.Length))"
          } else {
            Write-Host "No NKK_SETUP_KEY secret set — leaving setup.conf empty."
          }

      # Keep the embedded updater endpoint symmetric with where this workflow
      # publishes latest.json (github.repository). Prevents installed clients
      # from polling a stale repo after a move. For a non-GitHub host, set the
      # endpoint in tauri.conf.json and adjust the publish step (see HOW-TO-UPDATE).
      - name: Pin updater endpoint to this repo
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.plugins.updater.endpoints = @($url)
          ($conf | ConvertTo-Json -Depth 30) | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          Write-Host "Updater endpoint pinned to $url"

      - name: Build Tauri (NSIS with update signing)
        run: npm run tauri build -- --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Locate built installer
        id: find_installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No NSIS installer produced"
            exit 1
          }
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $patch = "${{ github.run_number }}"
          # Versioned release layout: release-out/<version>/build-<n>/ with a
          # clearly named exe. The official version is the folder; the build
          # number is our patch sub-version, so every build is traceable.
          $dir = "release-out/$ver/build-$patch"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $named = "NKK-Secure-Access-Setup-v$ver-build$patch.exe"
          Copy-Item $exe.FullName (Join-Path $dir $named)
          if (Test-Path "$($exe.FullName).sig") {
            Copy-Item "$($exe.FullName).sig" (Join-Path $dir "$named.sig")
          }
          Write-Host "Release: $dir/$named  ($([math]::Round($exe.Length / 1MB, 2)) MB)"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "reldir=$dir" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          "patch=$patch" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NKK-Secure-Access-Windows-v${{ steps.find_installer.outputs.version }}-build${{ steps.find_installer.outputs.patch }}
          path: ${{ steps.find_installer.outputs.reldir }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Generate Windows updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          $sig = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*.sig" | Select-Object -First 1
          $sigContent = if ($sig) { Get-Content $sig.FullName -Raw } else { "" }
          # Repo-relative so latest.json follows wherever the release is hosted.
          # GitHub normalizes spaces to dots in release asset names; mirror that
          # here so the updater URL matches the published asset (a space-URL 404s
          # and the Windows auto-update download fails silently). patch-manifest
          # additionally re-derives this URL from the GitHub API as a backstop.
          $assetName = $exe.Name -replace ' ', '.'
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$assetName"
          # Pull the changelog section for this version into the updater notes so
          # the in-app "Was ist neu" shows the real changelog.
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?s)## \[$version\].*?(?=\r?\n## \[|\z)").Value.Trim()
          $notes = if ($section) { $section } else { "NKK Secure Access $version" }
          $manifest = @{
            version = $version
            notes = $notes
            pub_date = ([System.DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ"))
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent.Trim()
                url = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 4
          Set-Content -Path "latest.json" -Value $manifest
          Write-Host "Generated latest.json for v$version"

      - name: Publish Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find_installer.outputs.path }}
            latest.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ vars.CANARY == 'true' }}
          name: "NKK Secure Access ${{ github.ref_name }}"
          body: |
            ## NKK Secure Access ${{ github.ref_name }}

            **Windows Auto Update:** Bestehende Installationen aktualisieren sich automatisch über `latest.json`.

            **Neuinstallation Windows:** `${{ steps.find_installer.outputs.name }}` herunterladen und doppelklicken.

            **Neuinstallation macOS:** die `.dmg` aus den Assets unten herunterladen, doppelklicken, App in Programme ziehen.

            Support: support@ticket.kronsolutions.de

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: macos-universal

      - name: Install npm dependencies
        run: npm ci

      # Tauri's bundle.resources mapping references Windows-only files (the
      # NetBird MSI, vc_redist, wintun.dll). They aren't used at runtime on
      # macOS but the bundler refuses to build if a resource path is missing.
      # We materialize empty placeholder files so the bundle step can succeed.
      - name: Materialize Windows-only bundle resources (macOS placeholder)
        run: |
          set -e
          cd src-tauri/bin
          : > netbird-installer.exe
          : > vc_redist.x64.exe
          : > wintun.dll
          : > setup.conf

      - name: Bake setup key into bundle (if secret is set)
        env:
          NKK_SETUP_KEY: ${{ secrets.NKK_SETUP_KEY }}
        run: |
          if [ -n "${NKK_SETUP_KEY:-}" ]; then
            printf '%s' "${NKK_SETUP_KEY}" > src-tauri/bin/setup.conf
            echo "Setup key baked into bundle (length: ${#NKK_SETUP_KEY})"
          else
            echo "No NKK_SETUP_KEY secret set — leaving setup.conf empty."
          fi

      - name: Pin updater endpoint to this repo
        run: |
          URL="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          node -e "const f='src-tauri/tauri.conf.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(f));j.plugins.updater.endpoints=['$URL'];fs.writeFileSync(f,JSON.stringify(j,null,2))"
          echo "Updater endpoint pinned to $URL"

      - name: Build Tauri (universal app + DMG, with updater artifact)
        run: npm run tauri build -- --bundles app,dmg --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Locate built DMG + updater artifact
        id: find_dmg
        run: |
          set -e
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          DMG=$(find "$BUNDLE/dmg" -name "*.dmg" -type f | head -1)
          TARGZ=$(find "$BUNDLE/macos" -name "*.app.tar.gz" -type f | head -1)
          SIG=$(find "$BUNDLE/macos" -name "*.app.tar.gz.sig" -type f | head -1)
          if [ -z "$DMG" ]; then echo "::error::No DMG produced"; exit 1; fi
          if [ -z "$TARGZ" ] || [ -z "$SIG" ]; then
            echo "::error::No macOS updater artifact (.app.tar.gz/.sig). Check createUpdaterArtifacts + TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          echo "Found DMG:   $DMG ($(( $(stat -f%z "$DMG") / 1024 / 1024 )) MB)"
          echo "Found targz: $TARGZ"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          echo "targz=$TARGZ" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nkk-secure-access-macos
          path: |
            ${{ steps.find_dmg.outputs.path }}
            ${{ steps.find_dmg.outputs.targz }}
            ${{ steps.find_dmg.outputs.sig }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find_dmg.outputs.path }}
            ${{ steps.find_dmg.outputs.targz }}
            ${{ steps.find_dmg.outputs.sig }}
          draft: false
          prerelease: ${{ vars.CANARY == 'true' }}
          # name/body intentionally omitted — Windows job already populates the
          # release; this run appends the DMG + the macOS updater artifact.

  # Merge macOS into the updater manifest after both platform builds. The
  # Windows job already published a windows-only latest.json; this adds the
  # darwin entries (one universal .app.tar.gz serves Intel + Apple Silicon).
  # Resilient: if the macOS artifact is absent it leaves latest.json
  # windows-only and never clobbers a good manifest.
  patch-manifest:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Add darwin to latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          API="repos/$REPO/releases/tags/$TAG"
          # Authoritative asset URLs from the API (GitHub normalizes filenames,
          # e.g. spaces -> dots; never construct these from local names).
          EXE_URL=$(gh api "$API" --jq '.assets[] | select(.name | endswith(".exe")) | .browser_download_url' | head -1)
          TARGZ_URL=$(gh api "$API" --jq '.assets[] | select(.name | endswith(".app.tar.gz")) | .browser_download_url' | head -1)
          SIG_URL=$(gh api "$API" --jq '.assets[] | select(.name | endswith(".app.tar.gz.sig")) | .browser_download_url' | head -1)
          MAC_SIG=""
          if [ -n "$SIG_URL" ]; then MAC_SIG=$(curl -fsSL "$SIG_URL"); fi
          curl -fsSL -o latest.json "https://github.com/$REPO/releases/download/$TAG/latest.json"
          EXE_URL="$EXE_URL" TARGZ_URL="$TARGZ_URL" MAC_SIG="$MAC_SIG" node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            if (!m.platforms || !m.platforms["windows-x86_64"]) {
              throw new Error("windows-x86_64 missing - refusing to clobber latest.json");
            }
            // Correct the Windows URL to the real (normalized) asset name; the
            // build step derives it from the local filename, which keeps spaces.
            if (process.env.EXE_URL) m.platforms["windows-x86_64"].url = process.env.EXE_URL;
            // One universal .app.tar.gz serves both macOS arches; add if present.
            const targz = process.env.TARGZ_URL;
            const sig = (process.env.MAC_SIG || "").trim();
            if (targz && sig) {
              m.platforms["darwin-aarch64"] = { signature: sig, url: targz };
              m.platforms["darwin-x86_64"] = { signature: sig, url: targz };
            } else {
              console.log("::warning::macOS updater artifact absent - manifest stays windows-only");
            }
            fs.writeFileSync("latest.json", JSON.stringify(m, null, 2));
            console.log("platforms now: " + Object.keys(m.platforms).join(", "));
          '
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          echo "latest.json finalized (windows url corrected; darwin merged when present)."
